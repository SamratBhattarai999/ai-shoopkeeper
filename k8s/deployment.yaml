apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-shopkeeper-deployment
  labels:
    app: ai-shopkeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-shopkeeper
  template:
    metadata:
      labels:
        app: ai-shopkeeper
    spec:
      containers:
      - name: ai-shopkeeper
        image: DOCKER_HUB_USERNAME/ai-shopkeeper:IMAGE_TAG
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1024Mi"
            cpu: "500m"
